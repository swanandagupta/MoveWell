version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: movewell-db
    environment:
      POSTGRES_USER: movewell
      POSTGRES_PASSWORD: movewellpassword
      POSTGRES_DB: movewelldb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movewell -d movewelldb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movewell-backend
    environment:
      DATABASE_URL: postgresql://movewell:movewellpassword@db:5432/movewelldb
      SECRET_KEY: movewell_super_secret_jwt_key_2026_rehabilitation
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: movewell-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
